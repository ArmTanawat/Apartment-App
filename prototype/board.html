<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กระดานห้อง — ต้นแบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+Thai+Looped:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFC; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#8C8C8C;
  --line:#E4E4E4; --primary:#1A1A1A; --primary-soft:#F0F0F0;
  --vacant:#B3382C; --vacant-soft:#F7F0EF; --attention:#8C8C8C; --danger:#B3382C;
  --occupied:#2E7D46;
}
[data-palette="pastel"]{
  --paper:#F6F9FC; --surface:#FFFFFF; --ink:#2B333D; --muted:#78838F;
  --line:#E1E8EF; --primary:#52779C; --primary-soft:#E9F1F8;
  --vacant:#A6B0B8; --vacant-soft:#F0F3F5; --attention:#E0906B; --danger:#C0685C;
  --occupied:#52779C;
}
[data-palette="teal"]{
  --paper:#FBFAF7; --surface:#FFFFFF; --ink:#2A2E2C; --muted:#7A827E;
  --line:#E5E3DD; --primary:#1F6F63; --primary-soft:#E3EFEC;
  --vacant:#8FA894; --vacant-soft:#EEF2EE; --attention:#E8A33D; --danger:#B4553F;
  --occupied:#1F6F63;
}
[data-palette="indigo"]{
  --paper:#F8F6F1; --surface:#FFFFFF; --ink:#26282F; --muted:#797D88;
  --line:#E4E0D7; --primary:#38477A; --primary-soft:#E7EAF3;
  --vacant:#9A9887; --vacant-soft:#F0EEE7; --attention:#C97B3C; --danger:#A9453F;
  --occupied:#38477A;
}
[data-palette="mulberry"]{
  --paper:#FBF7F8; --surface:#FFFFFF; --ink:#2E272B; --muted:#847A7E;
  --line:#E8DFE2; --primary:#7A3B5C; --primary-soft:#F2E6EC;
  --vacant:#8C9B84; --vacant-soft:#EFF2ED; --attention:#D08A34; --danger:#A8453C;
  --occupied:#7A3B5C;
}
[data-palette="ochre"]{
  --paper:#FCFAF5; --surface:#FFFFFF; --ink:#2C2A24; --muted:#807B6E;
  --line:#E7E2D5; --primary:#9A6B18; --primary-soft:#F5EDDC;
  --vacant:#7F9099; --vacant-soft:#EDF1F2; --attention:#C1552F; --danger:#A8433A;
  --occupied:#9A6B18;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans Thai","Sarabun","Thonburi",system-ui,sans-serif;
  line-height:1.75; font-size:15px;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
[data-font="looped"] body,[data-font="looped"] .rail,[data-font="looped"] .main{font-family:"Noto Sans Thai Looped","Sarabun",system-ui,sans-serif}
.app{display:grid; grid-template-columns:200px 1fr; min-height:100vh}

.rail{border-right:1px solid var(--line); padding:24px 0; background:var(--surface)}
.brand{padding:0 20px 24px; font-weight:700; font-size:18px; line-height:1.4}
.rrent{display:none}
.brand small{display:block; font-weight:400; font-size:13px; color:var(--muted); line-height:1.5}
.nav{display:flex; flex-direction:column; gap:2px; padding:0 12px}
.nav a{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  color:var(--muted); text-decoration:none; font-size:15px; transition:background .12s
}
.nav a:hover{background:var(--primary-soft); color:var(--primary)}
.nav a.on{background:var(--primary); color:#fff; font-weight:500}
.dotnav{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55}

.main{padding:28px 32px 48px; max-width:1180px}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:4px}
h1{font-size:32px; font-weight:700; margin:0; line-height:1.4}
.sub{color:var(--muted); font-size:15px; margin:0 0 24px}
.month{
  display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:15px
}
.month button{
  border:0; background:none; color:var(--muted); cursor:pointer;
  font-size:16px; line-height:1; padding:2px 4px; border-radius:4px
}
.month button:hover{background:var(--primary-soft); color:var(--primary)}

.filters{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer;
  font-family:inherit; transition:all .12s
}
.chip:hover{border-color:var(--primary); color:var(--primary)}
.chip.on{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:500}
.chip .n{opacity:.7; margin-left:6px}

.floor{margin-bottom:28px}
.floorlab{
  font-size:13px; color:var(--muted); margin-bottom:10px;
  display:flex; align-items:center; gap:10px
}
.floorlab::after{content:""; flex:1; height:1px; background:var(--line)}
.grid{display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:8px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}}

.room{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--vacant);
  border-radius:8px; padding:9px 9px 8px; cursor:pointer;
  transition:transform .12s, border-color .12s; text-align:left; font-family:inherit;
  display:flex; flex-direction:column; gap:1px; min-height:76px; overflow:hidden
}
.room:hover{transform:translateY(-1px); border-color:var(--primary)}
.room.occ{border-left-color:var(--occupied)}

.rno{font-size:17px; font-weight:500; letter-spacing:0; line-height:1.3}
.rname{font-size:12px; line-height:1.45; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rvac{font-size:12px; line-height:1.45; color:var(--vacant)}
.rfoot{margin-top:auto; display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); height:12px}
.dot{width:5px; height:5px; border-radius:50%; flex:none}
.dot.full{background:var(--muted)}
.dot.open{border:1px solid var(--muted)}
.rrent{margin-left:auto; font-size:12px; color:var(--muted)}

.legend{
  display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--muted);
  border-top:1px solid var(--line); padding-top:16px; margin-top:8px
}
.legend span{display:flex; align-items:center; gap:7px}
.swatch{width:10px; height:10px; border-radius:2px}

.pal{
  position:sticky; top:0; z-index:5; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 32px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px
}
.pal b{font-weight:500; color:var(--muted); margin-right:4px}
.pbtn{
  border:1px solid var(--line); background:var(--paper); border-radius:8px;
  padding:5px 12px 5px 8px; cursor:pointer; font-family:inherit; font-size:13px;
  color:var(--ink); display:flex; align-items:center; gap:7px
}
.pbtn:hover{border-color:var(--ink)}
.pbtn.on{border-color:var(--ink); font-weight:500}
.pdots{display:flex; gap:3px}
.pdots i{width:9px; height:9px; border-radius:2px; display:block}
.fbtn{border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:5px 12px;
  cursor:pointer; font-family:inherit; font-size:13px; color:var(--ink)}
.fbtn:hover{border-color:var(--ink)}
.fbtn.on{border-color:var(--ink); font-weight:500}
</style>
</head>
<body>

<div class="pal">
  <b>ชุดสี</b>
  <button class="pbtn on" data-p="minimal"><span class="pdots"><i style="background:#1A1A1A"></i><i style="background:#2E7D46"></i><i style="background:#B3382C"></i></span>ขาวดำ</button>
  <button class="pbtn" data-p="pastel"><span class="pdots"><i style="background:#52779C"></i><i style="background:#A6B0B8"></i><i style="background:#E0906B"></i></span>ฟ้าพาสเทล</button>
  <button class="pbtn" data-p="teal"><span class="pdots"><i style="background:#1F6F63"></i><i style="background:#8FA894"></i><i style="background:#E8A33D"></i></span>เขียวหัวเป็ด</button>
  <button class="pbtn" data-p="indigo"><span class="pdots"><i style="background:#38477A"></i><i style="background:#9A9887"></i><i style="background:#C97B3C"></i></span>ครามไทย</button>
  <button class="pbtn" data-p="mulberry"><span class="pdots"><i style="background:#7A3B5C"></i><i style="background:#8C9B84"></i><i style="background:#D08A34"></i></span>หม่อน</button>
  <button class="pbtn" data-p="ochre"><span class="pdots"><i style="background:#9A6B18"></i><i style="background:#7F9099"></i><i style="background:#C1552F"></i></span>ทองเก่า</button>
  <span style="width:1px;height:20px;background:var(--line);margin:0 4px"></span>
  <b>ฟอนต์</b>
  <button class="fbtn on" data-f="plain">ไม่มีหัว</button>
  <button class="fbtn" data-f="looped">มีหัว</button>
</div>

<div class="app">
  <aside class="rail">
    <div class="brand">บ้านสวนพลู<small id="brandcount"></small></div>
    <nav class="nav">
      <a href="#" class="on"><span class="dotnav"></span>ห้องพัก</a>
      <a href="#"><span class="dotnav"></span>รอบบิลเดือนนี้</a>
      <a href="#"><span class="dotnav"></span>บิล</a>
      <a href="#"><span class="dotnav"></span>ผู้เช่า</a>
      <a href="#"><span class="dotnav"></span>ตั้งค่า</a>
    </nav>
  </aside>

  <main class="main">
    <div class="head">
      <h1>ห้องพัก</h1>
      <div class="month">
        <button aria-label="เดือนก่อน">‹</button>
        <span>กันยายน <span class="num">2026</span></span>
        <button aria-label="เดือนถัดไป">›</button>
      </div>
    </div>
    <p class="sub" id="sub"></p>

    <div class="filters" id="filters"></div>
    <div id="board"></div>

    <div class="legend">
      <span><i class="swatch" style="background:var(--occupied)"></i>มีผู้เช่า</span>
      <span><i class="swatch" style="background:var(--vacant)"></i>ห้องว่าง</span>
      <span><i class="dot open"></i>ยังมีงานค้าง</span>
      <span><i class="dot full"></i>เรียบร้อยแล้ว</span>
    </div>
  </main>
</div>

<script>
const rooms=[
 {n:"101",f:1,t:"นภา วงศ์ดี",m:0,b:0,r:3900},
 {n:"102",f:1,t:null,m:0,b:0,r:3900},
 {n:"103",f:1,t:"วิชัย ทองสุข",m:1,b:1,r:3900},
 {n:"104",f:1,t:"สุดา แก้วใส",m:1,b:1,r:3900},
 {n:"105",f:1,t:"ธนา พงษ์ไพร",m:1,b:1,r:3900},
 {n:"106",f:1,t:null,m:0,b:0,r:3900},
 {n:"107",f:1,t:"เกษม บุญมา",m:1,b:1,r:3900},
 {n:"108",f:1,t:"จิรา สุขสันต์",m:0,b:0,r:3900},
 {n:"109",f:1,t:"ปรีชา ดวงแก้ว",m:1,b:1,r:3900},
 {n:"110",f:1,t:"อนงค์ พรหมมา",m:1,b:0,r:3900},
 {n:"201",f:2,t:"พิมพ์ใจ ศรีวรรณ",m:1,b:1,r:3800},
 {n:"202",f:2,t:"รัตนา จันทร์เพ็ญ",m:0,b:0,r:3800},
 {n:"203",f:2,t:"มานพ อินทร์แก้ว",m:1,b:1,r:3800},
 {n:"204",f:2,t:null,m:0,b:0,r:3800},
 {n:"205",f:2,t:"วารุณี นาคเงิน",m:0,b:0,r:3800},
 {n:"206",f:2,t:"ณัฐพล ชัยวัฒน์",m:1,b:1,r:3800},
 {n:"207",f:2,t:"สมหญิง เรืองศรี",m:1,b:1,r:3800},
 {n:"208",f:2,t:"ชูใจ พันธ์ดี",m:1,b:0,r:3800},
 {n:"209",f:2,t:null,m:0,b:0,r:3800},
 {n:"210",f:2,t:"ดวงพร มีสุข",m:1,b:1,r:3800},
 {n:"301",f:3,t:"สมบัติ เจริญผล",m:1,b:1,r:3700},
 {n:"302",f:3,t:"กัญญา ทิพย์วรรณ",m:1,b:1,r:3700},
 {n:"303",f:3,t:null,m:0,b:0,r:3700},
 {n:"304",f:3,t:"ไพศาล มงคล",m:1,b:1,r:3700},
 {n:"305",f:3,t:"ศิริพร บัวทอง",m:1,b:0,r:3700},
 {n:"306",f:3,t:"อดิศักดิ์ นวลจันทร์",m:0,b:0,r:3700},
 {n:"307",f:3,t:"เพ็ญศรี ขาวสะอาด",m:1,b:1,r:3700},
 {n:"308",f:3,t:null,m:0,b:0,r:3700},
 {n:"309",f:3,t:"ทวีศักดิ์ รุ่งเรือง",m:1,b:1,r:3700},
 {n:"310",f:3,t:"มะลิ หอมกรุ่น",m:1,b:1,r:3700}
];

const occ=r=>r.t!==null;
const filters=[
 {k:"all", l:"ทั้งหมด",        f:()=>true},
 {k:"vac", l:"ว่าง",           f:r=>!occ(r)},
 {k:"nom", l:"ยังไม่จดมิเตอร์", f:r=>occ(r)&&!r.m},
 {k:"nob", l:"ยังไม่ออกบิล",    f:r=>occ(r)&&!r.b}
];
let active="all";

function stat(){
  document.getElementById("brandcount").innerHTML = `<span class="num">${rooms.length}</span> ห้อง`;
  const o=rooms.filter(occ).length, v=rooms.length-o;
  const nm=rooms.filter(r=>occ(r)&&!r.m).length;
  document.getElementById("sub").innerHTML =
    `มีผู้เช่า <span class="num">${o}</span> ห้อง · ว่าง <span class="num">${v}</span> ห้อง` +
    (nm?` · ยังไม่จดมิเตอร์ <span class="num">${nm}</span> ห้อง`:` · จดมิเตอร์ครบแล้ว`);
}

function chips(){
  document.getElementById("filters").innerHTML = filters.map(x=>{
    const n=rooms.filter(x.f).length;
    return `<button class="chip${x.k===active?" on":""}" data-k="${x.k}">${x.l}<span class="n num">${n}</span></button>`;
  }).join("");
}

function board(){
  const fn=filters.find(x=>x.k===active).f;
  const list=rooms.filter(fn);
  let html="";
  [1,2,3].forEach(fl=>{
    const rs=list.filter(r=>r.f===fl);
    if(!rs.length) return;
    html+=`<div class="floor"><div class="floorlab">ชั้น ${fl}</div><div class="grid">`;
    rs.forEach(r=>{
      let note;
      if(!occ(r))      note = "";
      else if(!r.m)    note = `<i class="dot open"></i>ยังไม่จด`;
      else if(!r.b)    note = `<i class="dot open"></i>ยังไม่บิล`;
      else             note = `<i class="dot full"></i>ครบ`;
      html+=`<button class="room${occ(r)?" occ":""}">
        <div class="rno num">${r.n}</div>
        ${occ(r)?`<div class="rname">${r.t}</div>`:`<div class="rvac">ว่าง</div>`}
        <div class="rfoot">${note}</div>
      </button>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById("board").innerHTML = html ||
    `<p style="color:var(--muted)">ไม่มีห้องในหมวดนี้</p>`;
}

document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  active=b.dataset.k; chips(); board();
});
document.querySelector(".pal").addEventListener("click",e=>{
  const b=e.target.closest(".pbtn");
  if(b){
    if(b.dataset.p==="minimal") delete document.documentElement.dataset.palette;
    else document.documentElement.dataset.palette=b.dataset.p;
    document.querySelectorAll(".pbtn").forEach(x=>x.classList.toggle("on",x===b));
    return;
  }
  const f=e.target.closest(".fbtn");
  if(f){
    if(f.dataset.f==="plain") delete document.documentElement.dataset.font;
    else document.documentElement.dataset.font=f.dataset.f;
    document.querySelectorAll(".fbtn").forEach(x=>x.classList.toggle("on",x===f));
  }
});

stat(); chips(); board();
</script>
</body>
</html>
