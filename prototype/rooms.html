<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บ้านสวนพลู — ต้นแบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFC; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#8C8C8C;
  --line:#E4E4E4; --occupied:#2E7D46; --vacant:#B3382C; --soft:#F0F0F0;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;
  line-height:1.75; font-size:15px;
}
.num{font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  font-feature-settings:"zero" 0}
button{font-family:inherit}
.app{display:grid; grid-template-columns:200px 1fr; min-height:100vh}

/* ---------- rail ---------- */
.rail{border-right:1px solid var(--line); padding:24px 0; background:var(--surface)}
.brand{padding:0 20px 24px; font-weight:700; font-size:18px; line-height:1.4}
.brand small{display:block; font-weight:400; font-size:13px; color:var(--muted); line-height:1.5}
.nav{display:flex; flex-direction:column; gap:2px; padding:0 12px}
.nav a{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
  color:var(--muted); text-decoration:none; font-size:15px}
.nav a:hover{background:var(--soft); color:var(--ink)}
.nav a.on{background:var(--ink); color:#fff; font-weight:500}
.dotnav{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55}

/* ---------- shared ---------- */
.main{padding:28px 32px 64px; max-width:1180px}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px}
h1{font-size:32px; font-weight:700; margin:0; line-height:1.4}
.sub{color:var(--muted); font-size:15px; margin:2px 0 24px}
.tools{display:flex; align-items:center; gap:8px}
.monthwrap{position:relative}
.month{display:flex; align-items:center; gap:4px; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:6px 8px}
.monthlabel{border:0; background:none; color:var(--ink); font-family:inherit; font-size:15px;
  cursor:pointer; padding:2px 6px; border-radius:6px; min-width:132px; text-align:center}
.monthlabel:hover{background:var(--soft)}
.monthmenu{position:absolute; top:calc(100% + 5px); right:0; z-index:15; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:5px; min-width:190px;
  max-height:288px; overflow:auto; box-shadow:0 4px 16px rgba(0,0,0,.1)}
.monthopt{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
  border:0; background:none; font-family:inherit; font-size:14px; color:var(--ink);
  padding:7px 10px; border-radius:6px; cursor:pointer; text-align:left}
.monthopt:hover{background:var(--soft)}
.monthopt.on{background:var(--ink); color:#fff}
.monthopt .now{font-size:11px; color:var(--muted)}
.monthopt.on .now{color:rgba(255,255,255,.6)}
.month button{border:0; background:none; color:var(--muted); cursor:pointer; font-size:16px;
  line-height:1; padding:2px 5px; border-radius:4px}
.month button:hover:not([disabled]){background:var(--soft); color:var(--ink)}
.month button[disabled]{pointer-events:none}
.iconbtn{width:38px; height:38px; border:1px solid var(--line); background:var(--surface);
  border-radius:8px; cursor:pointer; font-size:16px; color:var(--muted); line-height:1}
.iconbtn:hover{border-color:var(--ink); color:var(--ink)}
.iconbtn.on{background:var(--ink); border-color:var(--ink); color:#fff}

.btn{border:1px solid var(--ink); background:var(--ink); color:#fff; border-radius:8px;
  padding:9px 16px; font-size:15px; cursor:pointer}
.btn:hover{opacity:.85}
.btn.ghost{background:var(--surface); color:var(--ink)}
.btn.ghost:hover{background:var(--soft); opacity:1}
.btn.quiet{background:var(--surface); color:var(--muted); border-color:var(--line)}
.btn.quiet:hover{border-color:var(--ink); color:var(--ink); background:var(--surface)}
.btn.danger{background:var(--surface); color:var(--vacant); border-color:var(--line)}
.btn.danger:hover{border-color:var(--vacant); background:var(--surface); opacity:1}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* ---------- board ---------- */
.filters{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer}
.chip:hover{border-color:var(--ink); color:var(--ink)}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:500}
.chip .n{opacity:.7; margin-left:6px}

.floor{margin-bottom:26px}
.floorlab{font-size:13px; color:var(--muted); margin-bottom:10px; display:flex;
  align-items:center; gap:10px}
.floorlab::after{content:""; flex:1; height:1px; background:var(--line)}
.grid{display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:8px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}}

.room{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--vacant);
  border-radius:8px; padding:9px 9px 8px; cursor:pointer; text-align:left;
  transition:transform .12s, border-color .12s;
  display:flex; flex-direction:column; gap:1px; min-height:76px; overflow:hidden}
.room:hover{transform:translateY(-1px); border-color:var(--ink)}
.room.occ{border-left-color:var(--occupied)}
.room.soon{border-left-style:dashed}
.leaving{color:var(--ink); font-weight:500}
.rno{font-size:17px; font-weight:500; line-height:1.3}
.rname{font-size:12px; line-height:1.45; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rvac{font-size:12px; line-height:1.45; color:var(--vacant)}
.rfoot{margin-top:auto; display:flex; align-items:center; gap:4px; font-size:11px;
  color:var(--muted); height:14px}
.dot{width:5px; height:5px; border-radius:50%; flex:none}
.dot.full{background:var(--muted)}
.dot.open{border:1px solid var(--muted)}

.addcard{background:var(--soft); border:1px dashed var(--line); border-radius:8px;
  min-height:76px; cursor:pointer; color:var(--muted); font-size:22px; line-height:1;
  display:flex; align-items:center; justify-content:center}
.addcard:hover{border-color:var(--ink); color:var(--ink)}
.addfloor{margin-top:4px}

.legend{display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--muted);
  border-top:1px solid var(--line); padding-top:16px}
.legend span{display:flex; align-items:center; gap:7px}
.swatch{width:10px; height:10px; border-radius:2px}

/* ---------- room page ---------- */
.back{border:0; background:none; color:var(--muted); cursor:pointer; font-size:14px;
  padding:0; margin-bottom:14px}
.back:hover{color:var(--ink)}
.roomhead{display:flex; align-items:flex-start; justify-content:space-between; gap:20px}
.roomtitle{display:flex; align-items:baseline; gap:14px}
.roomtitle h1{font-size:38px}
.tag{font-size:13px; padding:3px 10px; border-radius:999px; border:1px solid}
.tag.occ{color:var(--occupied); border-color:var(--occupied)}
.tag.vac{color:var(--vacant); border-color:var(--vacant)}

.cards{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:22px; align-items:start}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:18px 20px}
.card h2{font-size:15px; font-weight:500; margin:0 0 14px; display:flex;
  align-items:center; justify-content:space-between; gap:10px}
.card h2 button{font-size:13px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; text-align:right}
.rowlist{font-size:14px}
.rowitem{display:flex; justify-content:space-between; gap:12px; padding:7px 0;
  border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:0}
.rowitem small{color:var(--muted); font-size:12px; display:block; line-height:1.5}
.none{color:var(--muted); font-size:14px}
.linkbtn{border:0; background:none; color:var(--muted); cursor:pointer; font-size:13px; padding:0}
.linkbtn:hover{color:var(--ink); text-decoration:underline}
.linkbtn.danger:hover{color:var(--vacant)}
.actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}

/* ---------- meter table ---------- */
.mtable{width:100%; max-width:680px; border-collapse:collapse; font-size:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.mtable th{font-weight:500; font-size:12px; color:var(--muted); text-align:left;
  padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
.mtable th.r{text-align:right}
.mtable th.c{text-align:center}
.mtable td{padding:7px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
.mtable tr:last-child td{border-bottom:0}
.mtable tr:hover td{background:#FAFAFA}
.frow td{background:var(--paper) !important; color:var(--muted); font-size:11px;
  letter-spacing:.04em; padding:7px 12px; border-bottom:1px solid var(--line)}
.frow:hover td{background:var(--paper) !important}
.mno{font-size:15px; font-weight:500}
.mname{color:var(--ink); font-size:13px; max-width:150px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.mprev{color:var(--ink); text-align:right; width:72px; white-space:nowrap}
.marrow{color:#D8D8D8; padding:0 !important; width:18px; text-align:center; font-size:12px}
.mcell{width:88px; padding-left:4px !important}
.mcell input{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
  font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:14px; text-align:right; background:var(--surface); color:var(--ink)}
.mcell input:focus{outline:2px solid var(--ink); outline-offset:-1px; border-color:transparent}
.mcell input.bad{border-color:var(--vacant); background:#FDF6F5}
.munit{width:56px; text-align:right; color:var(--ink); font-size:13px;
  font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
.munit b{color:var(--ink); font-weight:500}
.mstat{width:168px; text-align:right; font-size:12px; color:var(--ink);
  white-space:nowrap; padding-right:14px !important}
.mstat.ok{color:var(--occupied)}
.mstat.no{color:var(--vacant)}
.mprogress{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.bar{flex:1; max-width:280px; height:5px; background:var(--line); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--occupied)}
.editprev{border:0; background:none; color:var(--muted); cursor:pointer; font-size:11px;
  padding:0 0 0 4px}
.editprev:hover{color:var(--ink); text-decoration:underline}
.switch{display:inline-flex; align-items:center; gap:9px; font-size:14px;
  color:var(--muted); cursor:pointer; user-select:none; padding:6px 4px 6px 10px;
  border:0; background:none; font-family:inherit}
.switch:hover{color:var(--ink)}
.track{width:36px; height:20px; border-radius:999px; background:var(--line);
  position:relative; transition:background .15s; flex:none}
.track i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .15s}
.switch.on .track{background:var(--ink)}
.switch.on .track i{left:18px}
.switch.on{color:var(--ink)}

/* stacked water/electricity rows inside one room row */
.mtable td.roomcell{border-right:1px solid var(--line); width:150px; padding-left:14px}
.mtable td.statcell{border-left:1px solid var(--line)}
.mlab{font-size:12px; color:var(--ink); width:34px; padding-left:14px !important}
.mtable tr.sub td{border-bottom:0; padding-top:6px; padding-bottom:6px}
.mtable tr.sub.last td{border-bottom:1px solid var(--line); padding-bottom:9px}
.mtable tr.sub:not(.last) td{padding-top:9px}
.rollnote{font-size:10px; color:var(--muted); display:block; line-height:1.3;
  font-family:"Noto Sans Thai",sans-serif}
.fixhead{display:block; color:var(--vacant); margin-bottom:5px}
.fixrow{display:flex; gap:5px; margin-top:4px; align-items:center; justify-content:flex-end}
.fixlab{font-size:11px; color:var(--ink); width:20px; text-align:right}
.fixrow button{font-size:11px; padding:3px 8px; border:1px solid var(--line);
  background:var(--surface); border-radius:6px; cursor:pointer; color:var(--ink)}
.fixrow button:hover{border-color:var(--ink)}

/* ---------- tenants ---------- */
.search{display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-width:300px}
.search input{border:0; outline:0; font-family:inherit; font-size:15px; width:100%;
  background:none; color:var(--ink)}
.search span{color:var(--muted); font-size:14px}
.ttable{width:100%; max-width:900px; border-collapse:collapse; font-size:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.ttable th{font-weight:500; font-size:12px; color:var(--muted); text-align:left;
  padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
.ttable td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.ttable tr:last-child td{border-bottom:0}
.ttable tbody tr{cursor:pointer}
.ttable tbody tr:hover td{background:#FAFAFA}
.tname{font-weight:500}
.tmiss{color:var(--vacant); font-size:12px; display:block; line-height:1.5}
.roomtag{display:inline-block; font-family:"Roboto Mono",monospace; font-size:12px;
  border:1px solid var(--line); border-radius:5px; padding:1px 7px; margin:0 3px 3px 0}
.roomtag.past{color:var(--muted); border-style:dashed}
.tdim{color:var(--muted)}

/* ---------- settings ---------- */
.setwrap{max-width:640px}
.setcard{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:20px 22px; margin-bottom:16px}
.setcard h2{font-size:16px; font-weight:500; margin:0 0 4px}
.setcard .lead{color:var(--muted); font-size:13px; margin:0 0 16px; line-height:1.6}
.rateline{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:14px}
.rateline label{color:var(--muted); min-width:120px}
.rateline input{width:84px; padding:7px 10px; border:1px solid var(--line); border-radius:7px;
  font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:14px; text-align:right; background:var(--surface); color:var(--ink)}
.rateline input:focus{outline:2px solid var(--ink); outline-offset:-1px; border-color:transparent}
.rateline span{color:var(--muted); font-size:13px}
.example{background:var(--soft); border-radius:7px; padding:12px 14px; margin-top:14px;
  font-size:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.example input{width:64px; padding:5px 9px; border:1px solid var(--line); border-radius:6px;
  font-family:"Roboto Mono",monospace; text-align:right; font-size:14px;
  background:var(--surface); color:var(--ink)}
.example b{font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums; font-size:16px}
.ftable{width:100%; border-collapse:collapse; font-size:14px}
.ftable th{font-size:12px; color:var(--muted); font-weight:500; text-align:left;
  padding:0 0 8px; border-bottom:1px solid var(--line)}
.ftable th.r{text-align:right}
.ftable td{padding:10px 0; border-bottom:1px solid var(--line)}
.ftable tr:last-child td{border-bottom:0}
.ftable td.r{text-align:right}
.retired{color:var(--muted)}
.retired .fname{text-decoration:line-through}
.bklist{font-size:13px}
.bkrow{display:flex; justify-content:space-between; padding:6px 0;
  border-bottom:1px solid var(--line); color:var(--muted)}
.bkrow:last-child{border-bottom:0}
.bkrow b{color:var(--ink); font-weight:400; font-family:"Roboto Mono",monospace}

/* ---------- bills ---------- */
.billwrap{max-width:760px}
.pickgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
.floorpick{margin:12px 0}
.floorpicklab{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); margin-bottom:6px}
.floorpicklab::after{content:""; flex:1; height:1px; background:var(--line); order:1}
.floorpicklab button{order:2; font-size:12px}
.pick{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
  border-radius:7px; padding:6px 8px; cursor:pointer; font-size:13px; font-family:inherit; color:var(--ink)}
.pick:hover{border-color:var(--ink)}
.pick.on{border-color:var(--ink); background:var(--soft)}
.pick.gone{opacity:.45; cursor:not-allowed}
.pick .box{width:13px; height:13px; border:1.5px solid var(--line); border-radius:3px; flex:none}
.pick.on .box{background:var(--ink); border-color:var(--ink)}
.pick .rn{font-family:"Roboto Mono",monospace; font-size:13px}
.rangebar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.rangebar input{width:74px; padding:6px 9px; border:1px solid var(--line); border-radius:7px;
  font-family:"Roboto Mono",monospace; text-align:center; font-size:14px;
  background:var(--surface); color:var(--ink)}
.pvtable{width:100%; border-collapse:collapse; font-size:13px; margin-top:12px}
.pvtable th{font-size:11px; color:var(--muted); font-weight:500; text-align:left;
  padding:0 8px 7px 0; border-bottom:1px solid var(--line)}
.pvtable th.r{text-align:right}
.pvtable td{padding:8px 8px 8px 0; border-bottom:1px solid var(--line)}
.pvtable td.r{text-align:right; font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
.pvtable tr.sum td{border-bottom:0; font-weight:500; padding-top:11px}
.pvtable td.bad{color:var(--vacant)}
.result{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-top:14px; font-size:14px}
.result h4{margin:0 0 8px; font-size:15px; font-weight:500}
.result .skip{color:var(--vacant); font-size:13px; margin-top:8px; line-height:1.7}
.blist{width:100%; border-collapse:collapse; font-size:14px}
.blist th{font-size:12px; color:var(--muted); font-weight:500; text-align:left;
  padding:0 0 9px; border-bottom:1px solid var(--line)}
.blist th.r{text-align:right}
.blist td{padding:11px 0; border-bottom:1px solid var(--line)}
.blist tr:last-child td{border-bottom:0}
.blist td.r{text-align:right}
.blist tbody tr{cursor:pointer}
.blist tbody tr:hover td{background:#FAFAFA}

/* one bill */
.paper{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:32px 36px; max-width:640px}
.phead{display:flex; justify-content:space-between; gap:24px; border-bottom:2px solid var(--ink);
  padding-bottom:16px; margin-bottom:18px}
.phead h2{margin:0 0 4px; font-size:20px; font-weight:700}
.phead .small{font-size:13px; color:var(--muted); line-height:1.7}
.pto{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px; margin-bottom:20px}
.pto dt{color:var(--muted)}
.pto dd{margin:0}
.pitems{width:100%; border-collapse:collapse; font-size:14px}
.pitems th{font-size:12px; color:var(--muted); font-weight:500; text-align:left;
  padding:0 0 8px; border-bottom:1px solid var(--line)}
.pitems th.r{text-align:right}
.pitems td{padding:9px 0; border-bottom:1px solid var(--line); vertical-align:top}
.pitems td small{display:block; color:var(--muted); font-size:12px; line-height:1.6}
.pitems td.r{text-align:right; font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:14px}
.pitems tr.total td{border-bottom:0; border-top:2px solid var(--ink);
  font-weight:700; font-size:16px; padding-top:12px}
.pfoot{margin-top:24px; padding-top:16px; border-top:1px solid var(--line);
  font-size:13px; color:var(--muted); line-height:1.8}
.pfoot b{color:var(--ink); font-weight:500}
.papers .paper{margin-bottom:20px}
.stale{background:#FFF8E6; border:1px solid var(--attention); border-radius:8px;
  padding:14px 16px; margin-bottom:16px; font-size:14px; line-height:1.7; max-width:640px}
.diff{font-size:13px; margin:8px 0 0; padding-left:0; list-style:none}
.diff li{padding:3px 0; color:var(--muted)}
.diff b{color:var(--ink); font-family:"Roboto Mono",monospace}

@media print{
  .rail, .head, .sub, .stale, .noprint{display:none !important}
  .app{display:block}
  .main{padding:0; max-width:none}
  .paper{border:0; padding:0; max-width:none}
  /* One invoice per sheet when several print together. Saving the result as a
     PDF is the browser's own Print dialog, not something built here. */
  .paper + .paper{page-break-before:always}
  body{background:#fff}
}

/* ---------- form + modal ---------- */
.field{margin-bottom:14px}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
.field input,.field select{width:100%; padding:9px 11px; border:1px solid var(--line);
  border-radius:8px; font-size:15px; font-family:inherit; background:var(--surface); color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--ink); outline-offset:-1px; border-color:transparent}
.field .hint{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}

.veil{position:fixed; inset:0; background:rgba(0,0,0,.28); display:flex;

.modal{background:var(--surface); border-radius:10px; padding:24px; width:100%;

.modal h3{margin:0 0 4px; font-size:19px; font-weight:700}
.modal .lead{color:var(--muted); font-size:14px; margin:0 0 18px; line-height:1.6}
.modal .actions{justify-content:flex-end; margin-top:20px}

.warn{background:var(--soft); border:1px solid var(--line); border-radius:8px;

/* ============ mock data — stands in for the API ============ */

// The month being worked on. One value shared by บันทึกมิเตอร์ and บิล, and

];

/* ============ helpers that mirror the API's rules ============ */
const baht = n => n.toLocaleString("th-TH",{minimumFractionDigits:2, maximumFractionDigits:2});
const floors = () => [...new Set(units.map(u=>u.floor))].sort((a,b)=>a-b);

// end_date is THE DAY THE ROOM BECOMES FREE, not the last night slept.
// A lease covers a date when it started on or before it and ends after it.
// Every date comparison in the app uses this meaning; mixing >= and > here
// makes the board show a room as vacant that nobody can be moved into.
const leaseOn = (unitId, date) => leases.find(l =>
  l.unit_id===unitId && l.start_date<=date && (!l.end_date || l.end_date>date));
const activeLease = unitId => leaseOn(unitId, TODAY);
// A move-out already entered for a future date. The room is still occupied,
// but it is about to come free and that is worth seeing on the board.
const leavingOn = unitId => { const l = activeLease(unitId); return l && l.end_date ? l.end_date : null; };
const thaiDate = iso => { const [y,m,d] = iso.split("-").map(Number);
  return d + " " + ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][m-1]; };
const tenantOf = leaseId => tenants.find(t => t.id === (leases.find(l=>l.id===leaseId)||{}).tenant_id);

// The overlap test the backend runs before creating a lease. Comparing against
// today would wrongly allow a lease starting inside someone else's stay.
// A lease ending on the 15th and one starting on the 15th do not overlap.
function overlapping(unitId, start, end){
  return leases.find(l => l.unit_id===unitId
    && (!l.end_date || l.end_date > start)
    && (!end || l.start_date < end));
}

// Last reading before this period, used to prefill the previous boxes so only
// one number per meter is typed. Falls back to the most recent reading rather
// than exactly last month, so a skipped month does not break the chain.
function previousReading(unitId, period){
  // A row whose current reading was cleared has nothing to carry forward, so
  // the chain steps back past it to the last month that was actually finished.
  const past = readings.filter(r => r.unit_id===unitId && r.period < period
      && r.water_curr != null && r.elec_curr != null)
    .sort((a,b) => b.period.localeCompare(a.period));
  return past.length ? {water: past[0].water_curr, elec: past[0].elec_curr, from: past[0].period}
                     : {water: 0, elec: 0, from: null};
}
// Every lease that occupied the room at any point during a period — usually
// one, but two in a handover month. The room page needs this rather than just
// today's lease: a tenant who moved out on the 10th still gets a bill for that
// month, and a repair found afterwards is still theirs to pay.
function leasesInPeriod(unitId, period){
  const first = period + "-01", last = period + "-31";
  return leases.filter(l => l.unit_id===unitId
    && l.start_date <= last && (!l.end_date || l.end_date > first))
    .sort((a,b)=>a.start_date.localeCompare(b.start_date));
}
// A row can exist with a previous reading but no current one — the state left
// after the previous figure was corrected and the meter needs reading again.
// "Metered" means both current numbers are actually in.
const metered = unitId => readings.some(r => r.unit_id===unitId && r.period===period
  && r.water_curr !== null && r.water_curr !== undefined
  && r.elec_curr !== null && r.elec_curr !== undefined);
const billed  = unitId => {
  const l = activeLease(unitId);
  return !!(l && bills.some(b => b.lease_id===l.id && b.period===period));
};

/* ============ router ============ */

/* ============ board ============ */
const filterDefs = [

];

function boardHTML(){
  const occ = units.filter(u=>activeLease(u.id)).length;
  const nm  = units.filter(u=>activeLease(u.id)&&!metered(u.id)).length;
  const fn  = filterDefs.find(f=>f.k===filter).f;
  const shown = units.filter(fn);

  let body = "";
  floors().forEach(fl=>{
    const rs = shown.filter(u=>u.floor===fl);
    if(!rs.length && !editMode) return;
    body += `<div class="floor"><div class="floorlab">ชั้น ${fl}</div><div class="grid">`;
    rs.forEach(u=>{
      const l = activeLease(u.id);
      const t = l ? tenantOf(l.id) : null;
      const leave = leavingOn(u.id);
      let note = "";
      if(l && !metered(u.id))      note = `<i class="dot open"></i>ยังไม่จด`;
      else if(l && !billed(u.id))  note = `<i class="dot open"></i>ยังไม่มีบิล`;
      else if(l)                   note = `<i class="dot full"></i>ครบ`;
      // A scheduled move-out replaces the work note. For this room, the fact
      // that it frees up on a known date is the more useful thing to see.
      if(leave) note = `<span class="leaving">ว่าง ${thaiDate(leave)}</span>`;
      body += `<button class="room${l?" occ":""}${leave?" soon":""}" data-room="${u.id}">

        ${l ? `<div class="rname">${t.full_name}</div>` : `<div class="rvac">ว่าง</div>`}
        <div class="rfoot">${note}</div>
      </button>`;
    });
    if(editMode) body += `<button class="addcard" data-addroom="${fl}" title="เพิ่มห้องชั้น ${fl}">+</button>`;
    body += `</div></div>`;
  });

  if(editMode){
    body += `<div class="addfloor"><button class="btn ghost" data-addfloor>+ เพิ่มชั้น</button></div>`;
  }
  if(!body) body = `<p class="none">ไม่มีห้องในหมวดนี้</p>`;

  return `
  <div class="head">
    <h1>ห้องพัก</h1>
    <div class="tools">
      <button class="iconbtn${editMode?" on":""}" id="pencil"

  <p class="sub" style="margin-top:-18px">
    งานค้างของงวด <b>${periodLabel(period)}</b> ·
    ${nm ? `ยังไม่จดมิเตอร์ <span class="num">${nm}</span> ห้อง` : `จดมิเตอร์ครบแล้ว`}
    ${period !== thisMonth() ? `<button class="linkbtn" data-month="now"
      style="margin-left:8px">กลับมาเดือนปัจจุบัน</button>` : ``}</p>
  <div class="filters">
    ${filterDefs.map(f=>`<button class="chip${f.k===filter?" on":""}" data-filter="${f.k}">
      ${f.l}<span class="n num">${units.filter(f.f).length}</span></button>`).join("")}
  </div>
  ${body}
  <div class="legend">
    <span><i class="swatch" style="background:var(--occupied)"></i>มีผู้เช่า</span>
    <span><i class="swatch" style="background:var(--vacant)"></i>ห้องว่าง</span>
    <span><i class="dot open"></i>ยังมีงานค้าง</span>
    <span><i class="dot full"></i>เรียบร้อยแล้ว</span>
    <span><i class="swatch" style="background:transparent;border-left:3px dashed var(--occupied);border-radius:0;width:3px"></i>มีกำหนดย้ายออก</span>
  </div>`;
}

/* ============ room page ============ */

      ${hasHistory ? `<div class="warn" style="margin:14px 0 0">ห้องนี้มีประวัติสัญญาเช่าแล้ว ลบไม่ได้</div>` : ``}
    </div>

    <div class="card">
      <h2>ผู้เช่าปัจจุบัน</h2>
      ${l ? `
      <dl class="kv">
        <dt>ชื่อ</dt><dd>${t.full_name}</dd>
        <dt>โทร</dt><dd class="num">${t.phone||"—"}</dd>

        <dt>มัดจำ</dt><dd class="num">${baht(l.deposit)}</dd>
      </dl>
      ${(!t.phone || !t.address) ? `<div class="warn" style="margin:14px 0 0;
        border-color:var(--vacant);color:var(--vacant)">
        ยังไม่มี ${[!t.phone?"เบอร์โทร":null,!t.address?"ที่อยู่":null].filter(Boolean).join(" และ ")}
        ซึ่งต้องขึ้นบนใบแจ้งหนี้</div>` : ``}
      ${l.end_date ? `<div class="warn" style="margin:14px 0 0">

// Saving happens per row as the number is typed, so leaving the page mid-way
// never loses anything. There is deliberately no submit button.
function commitMeter(unitId){
  const wIn = document.querySelector(`[data-w="${unitId}"]`);
  const eIn = document.querySelector(`[data-e="${unitId}"]`);
  if(!wIn || !eIn) return;

  const r = readings.find(x => x.unit_id === unitId && x.period === period);
  const prev = previousReading(unitId, period);
  const wp = r ? r.water_prev : prev.water;
  const ep = r ? r.elec_prev  : prev.elec;
  const wroll = r ? (r.water_rollover || 0) : 0;
  const eroll = r ? (r.elec_rollover  || 0) : 0;
  const wc = wIn.value.trim() === "" ? null : parseFloat(wIn.value);
  const ec = eIn.value.trim() === "" ? null : parseFloat(eIn.value);

  const stat = document.querySelector(`[data-st="${unitId}"]`);
  const wu = document.querySelector(`[data-wu="${unitId}"]`);
  const eu = document.querySelector(`[data-eu="${unitId}"]`);

  const wUsed = wc === null || isNaN(wc) ? null : (wc + wroll) - wp;
  const eUsed = ec === null || isNaN(ec) ? null : (ec + eroll) - ep;
  const wBad = wUsed !== null && wUsed < 0;
  const eBad = eUsed !== null && eUsed < 0;

  wIn.classList.toggle("bad", wBad);
  eIn.classList.toggle("bad", eBad);
  wu.innerHTML = wUsed !== null && !wBad
    ? `<b>${wUsed}</b>${wroll?`<span class="rollnote">ครบรอบ</span>`:``}` : "";
  eu.innerHTML = eUsed !== null && !eBad
    ? `<b>${eUsed}</b>${eroll?`<span class="rollnote">ครบรอบ</span>`:``}` : "";

  // Each meter is stored on its own. A water figure that is wrong must not
  // discard an electricity figure that was typed correctly beside it, which is
  // what returning early here used to do.
  const row = r || (() => {
    const fresh = {id:Date.now()+unitId, unit_id:unitId, period:period,
      water_prev:wp, water_curr:null, water_rollover:0,
      elec_prev:ep,  elec_curr:null,  elec_rollover:0};
    readings.push(fresh);
    return fresh;
  })();

  row.water_curr = (wc !== null && !isNaN(wc) && !wBad) ? wc : null;
  row.elec_curr  = (ec !== null && !isNaN(ec) && !eBad) ? ec : null;

  if(wBad || eBad){
    stat.className = "mstat no";
    // Water and electricity can both be wrong at once, and they are fixed
    // separately. One unlabelled pair of buttons would silently apply to
    // whichever meter the code happened to pick.
    const fixFor = (kind, label) => `
      <div class="fixrow">
        <span class="fixlab">${label}</span>
        <button data-fixnew="${unitId}" data-kind="${kind}"
          title="มิเตอร์ถูกเปลี่ยนใหม่ เริ่มนับจาก 0">เปลี่ยนมิเตอร์</button>
        <button data-fixroll="${unitId}" data-kind="${kind}"
          title="มิเตอร์หมุนครบรอบกลับมาเริ่มใหม่">ครบรอบ</button>
      </div>`;
    stat.innerHTML = `<span class="fixhead">เลขน้อยกว่าเดิม</span>
      ${wBad ? fixFor("w","น้ำ") : ""}${eBad ? fixFor("e","ไฟ") : ""}`;
    return;
  }

  if(row.water_curr === null || row.elec_curr === null){
    stat.className = "mstat";
    stat.textContent = (row.water_curr === null && row.elec_curr === null) ? "" : "ยังไม่ครบ";
    refreshProgress();
    return;
  }

  stat.className = "mstat ok";
  stat.textContent = "บันทึกแล้ว";
  refreshProgress();
}

// The dial wrapped: usage is what it counted up to its last digit, plus the
// new number. The rollover amount is the meter's capacity, from its digits.
function applyRollover(unitId, kind){
  const input = document.querySelector(`[data-${kind}="${unitId}"]`);
  const prev = previousReading(unitId, period);
  const r = readings.find(x => x.unit_id===unitId && x.period===period);
  const p = kind === "w" ? (r ? r.water_prev : prev.water) : (r ? r.elec_prev : prev.elec);
  // The dial's capacity comes from how many digits it has, which is a property
  // of the meter and is kept in settings. Counting the digits in the reading
  // would get it wrong for any meter showing a number padded with zeros.
  const digits = kind === "w" ? settings.water_meter_digits : settings.electricity_meter_digits;
  const cap = Math.pow(10, digits);

  const row = readings.find(x => x.unit_id===unitId && x.period===period);
  if(row) row[kind === "w" ? "water_rollover" : "elec_rollover"] = cap;
  else {
    const c = parseFloat(input.value) || 0;
    readings.push({id:Date.now()+unitId, unit_id:unitId, period:period,
      water_prev: prev.water, water_curr: kind==="w" ? c : prev.water,
      water_rollover: kind==="w" ? cap : 0,
      elec_prev: prev.elec, elec_curr: kind==="e" ? c : prev.elec,
      elec_rollover: kind==="e" ? cap : 0});
  }
  render();
}

// The meter was replaced, so it starts from zero and usage is just the new
// number. Same symptom as a rollover, different arithmetic.
function applyNewMeter(unitId, kind){
  const prev = previousReading(unitId, period);
  const r = readings.find(x => x.unit_id===unitId && x.period===period);
  if(r) r[kind === "w" ? "water_prev" : "elec_prev"] = 0;
  else readings.push({id:Date.now()+unitId, unit_id:unitId, period:period,
    water_prev: kind==="w" ? 0 : prev.water, water_curr: kind==="w" ? 0 : prev.water, water_rollover:0,
    elec_prev:  kind==="e" ? 0 : prev.elec,  elec_curr:  kind==="e" ? 0 : prev.elec,  elec_rollover:0});
  render();
}

function refreshProgress(){
  const need = units.filter(u => leasesInPeriod(u.id, period).length > 0);
  const done = need.filter(u => metered(u.id));
  const pct = need.length ? Math.round(done.length / need.length * 100) : 100;
  const p = document.querySelector(".mprogress");
  if(!p) return;
  p.querySelector("span").innerHTML =
    `จดแล้ว <span class="num">${done.length}</span> จาก <span class="num">${need.length}</span> ห้อง`;
  p.querySelector(".bar i").style.width = pct + "%";
  p.querySelectorAll("span")[1].textContent = pct + "%";
}

function editPrevModal(unitId){
  const u = units.find(x=>x.id===unitId);
  const r = readings.find(x=>x.unit_id===unitId && x.period===period);
  // The untouched close of the previous period. Editing this month never
  // writes to that row, so it stays available as the value to restore.
  const prev = previousReading(unitId, period);
  const curW = r ? r.water_prev : prev.water;
  const curE = r ? r.elec_prev  : prev.elec;
  const changedW = curW !== prev.water;
  const changedE = curE !== prev.elec;
  const rollW = r ? (r.water_rollover || 0) : 0;
  const rollE = r ? (r.elec_rollover  || 0) : 0;

  openModal(`
    <h3>แก้เลขก่อนหน้า ห้อง ${u.unit_number}</h3>
    <p class="lead">ปกติเลขนี้ดึงมาจากงวดก่อนเอง แก้เมื่อมิเตอร์ถูกเปลี่ยนใหม่
      หรืองวดก่อนพิมพ์ผิด</p>
    <div id="formErr"></div>

    ${prev.from ? `<div class="warn">
      <b>งวด ${prev.from} ปิดที่</b> — น้ำ <span class="num">${prev.water}</span>
      · ไฟ <span class="num">${prev.elec}</span><br>
      เลขนี้เก็บอยู่ในงวดก่อนและไม่ถูกแก้ไม่ว่าจะทำอะไรกับงวดนี้
      ${(changedW || changedE) ? `<div style="margin-top:8px">
        <button class="btn quiet" data-restoreprev="${unitId}"
          style="padding:5px 12px;font-size:13px">คืนค่าจากงวด ${prev.from}</button></div>` : ``}
    </div>` : `<div class="warn">ห้องนี้ยังไม่มีประวัติงวดก่อน</div>`}

    <div class="two">
      <div class="field"><label>น้ำ — เลขก่อนหน้า</label>
        <input id="pv_w" class="num" value="${curW}">
        ${changedW ? `<div class="hint" style="color:var(--vacant)">ถูกแก้จาก ${prev.water}</div>` : ``}</div>
      <div class="field"><label>ไฟ — เลขก่อนหน้า</label>
        <input id="pv_e" class="num" value="${curE}">
        ${changedE ? `<div class="hint" style="color:var(--vacant)">ถูกแก้จาก ${prev.elec}</div>` : ``}</div>
    </div>

    ${(rollW || rollE) ? `<div class="warn">
      ตั้งไว้ว่ามิเตอร์ครบรอบ${rollW?` · น้ำ +<span class="num">${rollW}</span>`:``}${rollE?` · ไฟ +<span class="num">${rollE}</span>`:``}
      <button class="btn quiet" data-clearroll="${unitId}"
        style="margin-left:10px;padding:5px 12px;font-size:13px">ยกเลิกครบรอบ</button>
    </div>` : ``}

    <div class="actions">
      <button class="btn ghost" data-close>ยกเลิก</button>
      <button class="btn" data-saveprev="${unitId}">บันทึก</button>
    </div>`);
}

function savePrev(unitId){
  const box = document.getElementById("formErr");
  const w = parseFloat(document.getElementById("pv_w").value);
  const e = parseFloat(document.getElementById("pv_e").value);
  if(isNaN(w) || isNaN(e)) return box.innerHTML = err("กรอกตัวเลขให้ครบ");

  const r = readings.find(x=>x.unit_id===unitId && x.period===period);
  if(r){
    // Raising the previous number above the current one is a normal thing to
    // want — the old figure was under-recorded, or the meter was swapped.
    // Blocking it forces the current reading to be inflated first, which is
    // backwards. Clear the current reading instead and ask for it again.
    if(r.water_curr !== null && r.water_curr < w) r.water_curr = null;
    if(r.elec_curr  !== null && r.elec_curr  < e) r.elec_curr  = null;
    Object.assign(r, {water_prev:w, elec_prev:e});
    // A rollover set against the old figures no longer means anything.
    if(r.water_curr === null) r.water_rollover = 0;
    if(r.elec_curr  === null) r.elec_rollover  = 0;
  } else {
    readings.push({id:Date.now()+unitId, unit_id:unitId, period:period,
      water_prev:w, water_curr:null, water_rollover:0,
      elec_prev:e,  elec_curr:null,  elec_rollover:0});
  }
  closeModal(); render();
}

// Name, phone and address are printed on the invoice. Anything missing here is
// a blank on a bill later, so it is worth surfacing before that happens.
const missingForBill = t => [!t.phone ? "เบอร์โทร" : null, !t.address ? "ที่อยู่" : null].filter(Boolean);

    {k:"cur",  l:"อยู่ปัจจุบัน",   f:x => x.rooms.some(r => r.current)},
    {k:"gone", l:"ย้ายออกแล้ว",   f:x => x.rooms.length > 0 && !x.rooms.some(r => r.current)},
    {k:"miss", l:"ข้อมูลไม่ครบ",  f:x => missingForBill(x.t).length > 0}
  ];

  const shown = withRooms
    .filter(filters.find(f => f.k === tenantFilter).f)
    .filter(x => !q || x.t.full_name.toLowerCase().includes(q) || (x.t.phone||"").includes(q))
    .sort((a,b) => a.t.full_name.localeCompare(b.t.full_name, "th"));

  const rows = shown.map(({t, rooms}) => {
    const miss = missingForBill(t);
    const cur = rooms.filter(r => r.current);
    const past = rooms.filter(r => !r.current);
    return `<tr data-tenant="${t.id}">
      <td>
        <span class="tname">${t.full_name}</span>

/* ============ bill calculation ============ */

const money = n => Math.round(n * 100) / 100;
const daysInPeriod = period => {
  const [y, m] = period.split("-").map(Number);
  return new Date(y, m, 0).getDate();
};
const THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
  "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const periodLabel = p => {
  const [y, m] = p.split("-").map(Number);
  return `${THAI_MONTHS[m-1]} ${y}`;
};
const shiftPeriod = (p, by) => {
  const [y, m] = p.split("-").map(Number);
  const d = new Date(y, m - 1 + by, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
};

// The month picker itself. Forward is capped at the current month; back is
// unlimited, because history is worth looking at and cannot be typed into.
let monthOpen = false;

function monthPicker(){
  const atLatest = period >= thisMonth();
  // Eighteen months back is enough to reach any bill worth revisiting without
  // the list becoming something to scroll through.
  const options = [];
  for(let i = 0; i < 18; i++) options.push(shiftPeriod(thisMonth(), -i));

  return `<div class="monthwrap">
    <div class="month">
      <button data-month="-1" aria-label="เดือนก่อน">‹</button>
      <button class="monthlabel" data-monthopen>${periodLabel(period)}</button>
      <button data-month="1" aria-label="เดือนถัดไป" ${atLatest?"disabled":""}>›</button>
    </div>
    ${monthOpen ? `<div class="monthmenu">
      ${options.map(p => `<button class="monthopt${p===period?" on":""}" data-monthpick="${p}">
        ${periodLabel(p)}${p===thisMonth()?`<span class="now">เดือนนี้</span>`:``}</button>`).join("")}
    </div>` : ``}
  </div>`;
}

const appliesMinimum = period =>
  period in periodSettings ? periodSettings[period] : true;

// Mirrors buildBill() in routes/bills.js. Every figure a tenant is charged
// comes through here, and the same function feeds both the preview and the
// saved bill so the two can never disagree.
function buildBill(leaseId, period, opts = {}){
  const { prorate = false, prorateDays = null } = opts;
  const lease = leases.find(l => l.id === leaseId);
  if(!lease) return { error: "ไม่พบสัญญาเช่า" };

  const unit = units.find(u => u.id === lease.unit_id);
  const tenant = tenants.find(t => t.id === lease.tenant_id);
  const r = readings.find(x => x.unit_id === lease.unit_id && x.period === period);

  if(!r || r.water_curr == null || r.elec_curr == null)
    return { error: `ห้อง ${unit.unit_number} ยังจดมิเตอร์ไม่ครบ` };

  const applyMin = appliesMinimum(period);
  const waterUsed = (r.water_curr + (r.water_rollover || 0)) - r.water_prev;
  const elecUsed  = (r.elec_curr  + (r.elec_rollover  || 0)) - r.elec_prev;

  const charge = (kind, used, from, to, rolled) => {
    const rate = settings[kind + "_rate"];
    const mu = settings[kind + "_min_units"];
    const ma = settings[kind + "_min_amount"];
    const meter = `${from} → ${to}${rolled ? " ครบรอบ" : ""}`;
    if(!applyMin) return { amount: money(used * rate),
      detail: `${used} หน่วย × ${rate} บาท (${meter})` };
    if(used <= mu) return { amount: money(ma),
      detail: `${used} หน่วย — ขั้นต่ำ ${ma} บาท ครอบคลุม ${mu} หน่วย (${meter})` };
    return { amount: money(ma + (used - mu) * rate),
      detail: `${used} หน่วย — ${ma} บาท สำหรับ ${mu} หน่วยแรก แล้ว ${used-mu} × ${rate} (${meter})` };
  };

  const water = charge("water", waterUsed, r.water_prev, r.water_curr, r.water_rollover);
  const elec  = charge("electricity", elecUsed, r.elec_prev, r.elec_curr, r.elec_rollover);

  let rentAmount = money(lease.monthly_rent);
  let rentDetail = `ห้อง ${unit.unit_number}`;
  if(prorate){
    const total = daysInPeriod(period);
    const days = prorateDays ?? total;
    if(days < 1 || days > total) return { error: `จำนวนวันต้องอยู่ระหว่าง 1 ถึง ${total}` };
    rentAmount = money(lease.monthly_rent / total * days);
    rentDetail = `ห้อง ${unit.unit_number} — คิด ${days} จาก ${total} วัน`;
  }

  const recurring = leaseFees.filter(f => f.lease_id === leaseId);
  const oneTime = charges.filter(c => c.lease_id === leaseId && c.period === period);
  const feesAmount = money(
    recurring.reduce((sum, f) => sum + f.amount, 0) +
    oneTime.reduce((sum, c) => sum + c.amount, 0));

  const items = [
    { label:"ค่าเช่า Rent", detail: rentDetail, amount: rentAmount },
    { label:"ค่าน้ำ Water", detail: water.detail, amount: water.amount },
    { label:"ค่าไฟ Electricity", detail: elec.detail, amount: elec.amount },
    ...recurring.map(f => ({ label:f.name, detail:"รายเดือน Monthly", amount: money(f.amount) })),
    ...oneTime.map(c => ({ label:c.description, detail:"ครั้งเดียว One-time", amount: money(c.amount) }))
  ];

  return {
    lease_id: leaseId, period,
    tenant_name: tenant.full_name, tenant_phone: tenant.phone, tenant_address: tenant.address,
    unit_number: unit.unit_number, floor: unit.floor,
    rent_amount: rentAmount, water_amount: water.amount, elec_amount: elec.amount,
    fees_amount: feesAmount,
    total: money(rentAmount + water.amount + elec.amount + feesAmount),
    water_used: waterUsed, elec_used: elecUsed,
    items
  };
}

function saveBill(built){
  const now = new Date();
  const p2 = n => String(n).padStart(2,"0");
  const stamp = `${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
  const bill = { id: ++nextId.bill, created_at: stamp, ...built };
  bills.push(bill);
  return bill;
}

/* ============ bills page ============ */
let picked = new Set();
let prorateOn = false;
let prorateDays = null;
let lastResult = null;

// Every lease that was in a room during the month. Two in a handover month,
// and each gets its own bill.
const billableLeases = unitId => leasesInPeriod(unitId, period);
const billFor = leaseId => bills.find(b => b.lease_id === leaseId && b.period === period);

function billsHTML(){
  const monthBills = bills.filter(b => b.period === period);
  const monthTotal = monthBills.reduce((s, b) => s + b.total, 0);
  const occupied = units.filter(u => billableLeases(u.id).length > 0);
  const totalDays = daysInPeriod(period);

  // Grouped by floor with a select-all per floor. Picking a whole floor is the
  // common case; a hand-typed range does the same thing more slowly.
  const picks = floors().map(fl => {
    const rs = units.filter(u => u.floor === fl);
    const pickable = rs.filter(u => billableLeases(u.id).length);
    const allOn = pickable.length > 0 && pickable.every(u => picked.has(u.id));
    const cells = rs.map(u => {
      const ls = billableLeases(u.id);
      const has = ls.length > 0;
      const done = has && ls.every(l => billFor(l.id));
      return `<button class="pick${picked.has(u.id)?" on":""}${has?"":" gone"}"
        ${has?`data-pick="${u.id}"`:""} title="${has ? (done?"ออกบิลแล้ว":"") : "ไม่มีผู้เช่าเดือนนี้"}">
        <span class="box"></span><span class="rn">${u.unit_number}</span>
        ${done?`<span style="font-size:11px;color:var(--muted)">✓</span>`:``}
      </button>`;
    }).join("");
    return `<div class="floorpick">
      <div class="floorpicklab"><span>ชั้น ${fl}</span>
        <button class="linkbtn" data-pickfloor="${fl}">${allOn?"เอาออก":"เลือกทั้งชั้น"}</button></div>
      <div class="pickgrid">${cells}</div>
    </div>`;
  }).join("");

  // Preview is computed live from the current selection, using the same
  // function that will write the bill.
  const previews = [];
  picked.forEach(uid => billableLeases(uid).forEach(l => {
    if(billFor(l.id)){
      previews.push({ unit: units.find(u=>u.id===uid).unit_number,
        tenant: tenantOf(l.id).full_name, skip: "ออกบิลเดือนนี้ไปแล้ว" });
      return;
    }
    const b = buildBill(l.id, period, {prorate: prorateOn, prorateDays});
    previews.push(b.error
      ? { unit: units.find(u=>u.id===uid).unit_number, tenant: tenantOf(l.id).full_name, skip: b.error }
      : { unit: b.unit_number, tenant: b.tenant_name, built: b, lease_id: l.id });
  }));
  const ready = previews.filter(p => p.built);
  const readyTotal = ready.reduce((s, p) => s + p.built.total, 0);

  return `
  <div class="head">
    <h1>บิล</h1>
    <div class="tools">${monthPicker()}</div>
  </div>
  <p class="sub">ดึงข้อมูลจากห้องพักและมิเตอร์มาคำนวณ ไม่ต้องกรอกอะไรเพิ่ม</p>

  <div class="billwrap">
    <div class="setcard">
      <h2>ออกบิล</h2>
      <p class="lead">เลือกห้อง ตรวจตัวเลข แล้วกดออกบิล</p>

      <div class="rangebar" style="margin-bottom:4px">
        <span>ช่วงห้อง</span>
        <input id="rgfrom" placeholder="101">
        <span>ถึง</span>
        <input id="rgto" placeholder="601">
        <button class="btn quiet" data-applyrange style="padding:6px 12px;font-size:13px">เลือก</button>
        <span style="flex:1"></span>
        <button class="btn quiet" data-pickall style="padding:6px 12px;font-size:13px">เลือกทั้งหมด</button>
        <button class="btn quiet" data-pickpending style="padding:6px 12px;font-size:13px">เฉพาะที่ยังไม่ออก</button>
        <button class="btn quiet" data-pickclear style="padding:6px 12px;font-size:13px">ล้าง</button>
      </div>
      ${picks}

      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-top:6px">
        <button class="switch${appliesMinimum(period)?" on":""}" data-togglemin>
          <span class="track"><i></i></span>คิดขั้นต่ำค่าน้ำค่าไฟ</button>
        <button class="switch${prorateOn?" on":""}" data-toggleprorate>
          <span class="track"><i></i></span>คิดค่าเช่าตามวันที่อยู่จริง</button>
        ${prorateOn ? `<span style="display:flex;align-items:center;gap:8px;font-size:14px">
          <input class="num" id="pdays" value="${prorateDays ?? totalDays}"
            style="width:56px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;
                   text-align:right;background:var(--surface);color:var(--ink)">
          <span style="color:var(--muted)">จาก ${totalDays} วัน</span></span>` : ``}
      </div>
      <p class="lead" style="margin:8px 0 0">สวิตช์ขั้นต่ำเป็นของทั้งตึกสำหรับเดือนนี้
        ส่วนคิดรายวันใช้กับรอบที่กำลังจะออกนี้เท่านั้น</p>

      ${picked.size ? `
      <table class="pvtable">
        <thead><tr><th>ห้อง</th><th>ผู้เช่า</th><th class="r">ค่าเช่า</th>
          <th class="r">น้ำ</th><th class="r">ไฟ</th><th class="r">อื่น ๆ</th><th class="r">รวม</th></tr></thead>
        <tbody>
        ${previews.map(p => p.skip
          ? `<tr><td class="num">${p.unit}</td><td>${p.tenant}</td>
               <td colspan="5" class="bad" style="font-size:13px">${p.skip}</td></tr>`
          : `<tr><td class="num">${p.unit}</td><td>${p.tenant}</td>
               <td class="r">${baht(p.built.rent_amount)}</td>
               <td class="r">${baht(p.built.water_amount)}</td>
               <td class="r">${baht(p.built.elec_amount)}</td>
               <td class="r">${baht(p.built.fees_amount)}</td>
               <td class="r">${baht(p.built.total)}</td></tr>`).join("")}
        ${ready.length ? `<tr class="sum"><td colspan="6">รวม ${ready.length} ใบ</td>
          <td class="r">${baht(readyTotal)}</td></tr>` : ``}
        </tbody>
      </table>` : `<p class="none" style="margin-top:14px">ยังไม่ได้เลือกห้อง</p>`}

      <div class="actions">
        <button class="btn" data-generate ${ready.length?"":"disabled"}>
          ออกบิล ${ready.length ? `${ready.length} ใบ` : ""}</button>
      </div>

      ${lastResult ? `<div class="result">
        <h4>ออกบิลแล้ว ${lastResult.made} ใบ${lastResult.skipped.length?` · ข้าม ${lastResult.skipped.length}`:``}</h4>
        ${lastResult.made ? `<div style="font-size:13px;color:var(--muted)">
          รวม ${baht(lastResult.total)} บาท</div>` : ``}
        ${lastResult.skipped.length ? `<div class="skip">
          ${lastResult.skipped.map(x => `ห้อง ${x.unit} — ${x.reason}`).join("<br>")}</div>` : ``}
      </div>` : ``}
    </div>

    <div class="setcard">
      <h2>บิลเดือนนี้</h2>

// Compares a saved bill with what the same inputs would produce now.
//
// The comparison is line by line, NOT on the total. Two mistakes can cancel
// out — a meter corrected down by 450 and a repair added for 450 leave the
// total identical while both lines are wrong — and a total-only check would
// report that nothing had changed.
function billDiff(bill){
  const fresh = buildBill(bill.lease_id, bill.period, {
    prorate: bill.items[0].detail.includes("จาก"),
    prorateDays: null
  });
  if(fresh.error) return { error: fresh.error };

  const key = i => i.label;
  const oldMap = new Map(bill.items.map(i => [key(i), i]));
  const newMap = new Map(fresh.items.map(i => [key(i), i]));
  const changes = [];

  new Set([...oldMap.keys(), ...newMap.keys()]).forEach(k => {
    const a = oldMap.get(k), b = newMap.get(k);
    if(!a) changes.push({ label:k, from:null, to:b.amount });
    else if(!b) changes.push({ label:k, from:a.amount, to:null });
    else if(a.amount !== b.amount) changes.push({ label:k, from:a.amount, to:b.amount });
  });

  return { changes, fresh };
}

// Every bill for the month, stacked one per page. The Print dialog's
// "Save as PDF" turns it into a file — nothing here generates one.
function printAllHTML(){
  const monthBills = bills.filter(b => b.period === period);
  if(!monthBills.length) return `<p class="none">ยังไม่มีบิลเดือนนี้</p>`;

      <b>บิล ${stale.length} ใบมีข้อมูลเปลี่ยนไปหลังออก</b><br>

// The same arithmetic the bill uses. Kept here so the worked example on the
// page cannot drift from what a tenant is actually charged.
function utilityCharge(kind, used){
  const rate = settings[kind + "_rate"];
  const minUnits = settings[kind + "_min_units"];
  const minAmount = settings[kind + "_min_amount"];
  return used <= minUnits ? minAmount : minAmount + (used - minUnits) * rate;
}

function saveFeeType(id){
  const box = document.getElementById("formErr");
  const name = document.getElementById("ft_name").value.trim();
  const amt = parseFloat(document.getElementById("ft_amt").value);
  if(!name) return box.innerHTML = err("ต้องมีชื่อรายการ");
  if(feeTypes.some(f => f.name === name && f.id !== id))
    return box.innerHTML = err(`มีรายการชื่อ "${name}" อยู่แล้ว`);
  if(isNaN(amt) || amt < 0) return box.innerHTML = err("ค่าตั้งต้นต้องเป็นตัวเลข");

  if(id) Object.assign(feeTypes.find(f => f.id === id), {name, default_amount:amt});
  else feeTypes.push({id:++nextId.fee, name, default_amount:amt, is_active:1});
  closeModal(); render();
}

/* ============ actions ============ */
function saveNewRoom(){
  const num = document.getElementById("f_num").value.trim();
  const fl  = parseInt(document.getElementById("f_floor").value, 10);
  const rent= parseFloat(document.getElementById("f_rent").value);
  const box = document.getElementById("formErr");

  if(!num)                       return box.innerHTML = err("ต้องใส่เลขห้อง");
  if(units.some(u=>u.unit_number===num)) return box.innerHTML = err(`ห้อง ${num} มีอยู่แล้ว`);
  if(!fl || fl<1)                return box.innerHTML = err("ชั้นต้องเป็นตัวเลขตั้งแต่ 1 ขึ้นไป");
  if(isNaN(rent) || rent<0)      return box.innerHTML = err("ค่าเช่าต้องเป็นตัวเลข");

  units.push({id:++nextId.unit, unit_number:num, floor:fl, base_rent:rent});
  closeModal(); render();
}

function saveEditRoom(id){
  const u = units.find(x=>x.id===id);
  const num = document.getElementById("f_num").value.trim();
  const fl  = parseInt(document.getElementById("f_floor").value, 10);
  const rent= parseFloat(document.getElementById("f_rent").value);
  const box = document.getElementById("formErr");

  if(!num)                        return box.innerHTML = err("ต้องใส่เลขห้อง");
  if(units.some(x=>x.unit_number===num && x.id!==id)) return box.innerHTML = err(`ห้อง ${num} มีอยู่แล้ว`);
  if(!fl || fl<1)                 return box.innerHTML = err("ชั้นต้องเป็นตัวเลขตั้งแต่ 1 ขึ้นไป");
  if(isNaN(rent) || rent<0)       return box.innerHTML = err("ค่าเช่าต้องเป็นตัวเลข");

  Object.assign(u, {unit_number:num, floor:fl, base_rent:rent});
  closeModal(); render();
}

function saveMoveIn(unitId){
  const box = document.getElementById("formErr");
  const sel = document.getElementById("f_tenant").value;
  const start = document.getElementById("f_start").value;
  const rent = parseFloat(document.getElementById("f_rent").value);
  const dep  = parseFloat(document.getElementById("f_dep").value);
  const u = units.find(x=>x.id===unitId);

  if(!sel)   return box.innerHTML = err("เลือกผู้เช่าก่อน");
  if(!start) return box.innerHTML = err("ใส่วันเข้าอยู่");

  // The same overlap test the API runs. It compares dates, not "today".
  const clash = overlapping(unitId, start, null);
  if(clash){
    const who = tenantOf(clash.id);
    const until = clash.end_date ? ` (ถึง ${clash.end_date})` : "";
    return box.innerHTML = err(`ห้อง ${u.unit_number} มีผู้เช่าอยู่แล้ว — ${who.full_name}${until}`);
  }

  let tid;
  if(sel === "new"){
    const nm = document.getElementById("f_newname").value.trim();
    if(!nm) return box.innerHTML = err("ใส่ชื่อผู้เช่าใหม่");
    tid = ++nextId.tenant;
    // Written straight into the shared tenants list, so the ผู้เช่า page shows
    // this person immediately — no separate step to register them.
    tenants.push({
      id:tid, full_name:nm,
      phone:   document.getElementById("f_newphone").value.trim(),
      address: document.getElementById("f_newaddr").value.trim(),
      id_card: document.getElementById("f_newid").value.trim()
    });
  } else tid = parseInt(sel,10);

  leases.push({id:++nextId.lease, tenant_id:tid, unit_id:unitId, start_date:start,
    end_date:null, monthly_rent:rent, deposit:dep});
  closeModal(); render();
}

function saveFee(leaseId, feeId){
  const box = document.getElementById("formErr");
  const amt = parseFloat(document.getElementById("fe_amt").value);
  if(isNaN(amt) || amt < 0) return box.innerHTML = err("ยอดต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป");

  if(feeId){
    leaseFees.find(f=>f.id===feeId).amount = amt;
  } else {
    const sel = document.getElementById("fe_type");
    const tid = parseInt(sel.value,10);
    const ft = feeTypes.find(t=>t.id===tid);
    leaseFees.push({id:++nextId.fee, lease_id:leaseId, fee_type_id:tid, name:ft.name, amount:amt});
  }
  closeModal(); render();
}

function saveCharge(){
  const box = document.getElementById("formErr");
  const leaseId = parseInt(document.getElementById("cg_lease").value,10);
  const desc = document.getElementById("cg_desc").value.trim();
  const amt = parseFloat(document.getElementById("cg_amt").value);
  if(!desc) return box.innerHTML = err("ใส่ชื่อรายการ");
  if(isNaN(amt)) return box.innerHTML = err("ใส่จำนวนเงิน");
  // No unique rule here: two separate repairs in one month are normal and each
  // should print as its own line.
  charges.push({id:++nextId.charge, lease_id:leaseId, period:period, description:desc, amount:amt});
  closeModal(); render();
}

function saveTenant(tenantId){
  const box = document.getElementById("formErr");
  const nm = document.getElementById("te_name").value.trim();
  if(!nm) return box.innerHTML = err("ต้องมีชื่อ");
  Object.assign(tenants.find(x=>x.id===tenantId), {
    full_name: nm,
    phone:   document.getElementById("te_phone").value.trim(),
    address: document.getElementById("te_addr").value.trim(),
    id_card: document.getElementById("te_id").value.trim()
  });
  closeModal(); render();
}

function saveLease(leaseId){
  const l = leases.find(x=>x.id===leaseId);
  const box = document.getElementById("formErr");
  const start = document.getElementById("le_start").value;
  const rent = parseFloat(document.getElementById("le_rent").value);
  const dep = parseFloat(document.getElementById("le_dep").value);

  if(!start) return box.innerHTML = err("ใส่วันเข้าอยู่");
  if(isNaN(rent) || rent < 0) return box.innerHTML = err("ค่าเช่าต้องเป็นตัวเลข");
  if(isNaN(dep) || dep < 0) return box.innerHTML = err("มัดจำต้องเป็นตัวเลข");
  if(l.end_date && start >= l.end_date)
    return box.innerHTML = err("วันเข้าอยู่ต้องก่อนวันที่ห้องว่าง");

  // Moving the start date can push this lease into someone else's stay.
  const clash = leases.find(x => x.unit_id===l.unit_id && x.id!==leaseId
    && (!x.end_date || x.end_date > start)
    && (!l.end_date || x.start_date < l.end_date));
  if(clash) return box.innerHTML = err(`ช่วงวันที่ทับกับสัญญาของ ${tenantOf(clash.id).full_name}`);

  Object.assign(l, {start_date:start, monthly_rent:rent, deposit:dep});
  closeModal(); render();
}

function saveMeter(unitId){
  const box = document.getElementById("formErr");
  const wp = parseFloat(document.getElementById("m_wp").value);
  const wc = parseFloat(document.getElementById("m_wc").value);
  const ep = parseFloat(document.getElementById("m_ep").value);
  const ec = parseFloat(document.getElementById("m_ec").value);

  if([wp,wc,ep,ec].some(isNaN)) return box.innerHTML = err("กรอกตัวเลขให้ครบทั้งสี่ช่อง");
  if(wc < wp) return box.innerHTML = err("เลขน้ำปัจจุบันน้อยกว่าเลขก่อนหน้า ตรวจดูอีกครั้ง");
  if(ec < ep) return box.innerHTML = err("เลขไฟปัจจุบันน้อยกว่าเลขก่อนหน้า ตรวจดูอีกครั้ง");

  const found = readings.find(x=>x.unit_id===unitId && x.period===period);
  if(found) Object.assign(found, {water_prev:wp, water_curr:wc, elec_prev:ep, elec_curr:ec});
  else readings.push({id:Date.now(), unit_id:unitId, period:period,
    water_prev:wp, water_curr:wc, elec_prev:ep, elec_curr:ec});
  closeModal(); render();
}

function saveMoveOut(leaseId){
  const l = leases.find(x=>x.id===leaseId);
  const end = document.getElementById("f_end").value;
  const box = document.getElementById("formErr");
  if(!end) return box.innerHTML = err("ใส่วันย้ายออก");
  if(end < l.start_date) return box.innerHTML = err("วันย้ายออกต้องไม่ก่อนวันเข้าอยู่");
  l.end_date = end;
  closeModal(); render();
}

/* ============ render + events ============ */
function render(){
  document.getElementById("brandname").textContent = settings.building_name;
  document.getElementById("brandcount").innerHTML =
    `<span class="num">${units.length}</span> ห้อง`;
  document.getElementById("main").innerHTML =
    view.name === "meter"   ? meterHTML()
    : view.name === "room"  ? roomHTML(view.id)
    : view.name === "tenants" ? tenantsHTML()
    : view.name === "tenant"  ? tenantHTML(view.id)
    : view.name === "settings" ? settingsHTML()
    : view.name === "bills" ? billsHTML()
    : view.name === "bill"  ? billHTML(view.id)
    : view.name === "printall" ? printAllHTML()
    : boardHTML();

  // Detail pages are reached from their list, so they keep the list highlighted.
  const active = view.name === "meter" ? "meter"
    : (view.name === "tenants" || view.name === "tenant") ? "tenants"
    : view.name === "settings" ? "settings"
    : ["bills","bill","printall"].includes(view.name) ? "bills"
    : "board";
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("on", a.dataset.nav === active));
}

document.addEventListener("click", e=>{
  const t = e.target;
  if(t.closest("[data-veil]") === t){ closeModal(); return; }
  if(t.closest("[data-close]")){ closeModal(); return; }

  const nav = t.closest("[data-nav]");
  if(nav){ e.preventDefault(); go({name: nav.dataset.nav}); return; }

  // ----- bills -----
  const pk = t.closest("[data-pick]");
  if(pk){
    const id = parseInt(pk.dataset.pick,10);
    picked.has(id) ? picked.delete(id) : picked.add(id);
    lastResult = null; render(); return;
  }
  if(t.closest("[data-monthopen]")){ monthOpen = !monthOpen; render(); return; }
  const mp = t.closest("[data-monthpick]");
  if(mp){
    period = mp.dataset.monthpick;
    monthOpen = false;
    picked = new Set(); lastResult = null;
    render(); return;
  }
  const mb = t.closest("[data-month]");
  if(mb){
    const v = mb.dataset.month;
    const next = v === "now" ? thisMonth() : shiftPeriod(period, parseInt(v,10));
    if(next > thisMonth()) return;
    period = next;
    // Anything scoped to the old month is meaningless in the new one.
    picked = new Set(); lastResult = null;
    monthOpen = false;
    render(); return;
  }
  // Any click elsewhere closes the month list.
  if(monthOpen && !t.closest(".monthwrap")){ monthOpen = false; render(); }

  const pf = t.closest("[data-pickfloor]");
  if(pf){
    const fl = parseInt(pf.dataset.pickfloor,10);
    const rs = units.filter(u => u.floor === fl && billableLeases(u.id).length);
    const allOn = rs.length > 0 && rs.every(u => picked.has(u.id));
    rs.forEach(u => allOn ? picked.delete(u.id) : picked.add(u.id));
    lastResult = null; render(); return;
  }
  if(t.closest("[data-pickall]")){
    picked = new Set(units.filter(u => billableLeases(u.id).length).map(u => u.id));
    lastResult = null; render(); return;
  }
  if(t.closest("[data-pickpending]")){
    picked = new Set(units.filter(u => {
      const ls = billableLeases(u.id);
      return ls.length && ls.some(l => !billFor(l.id));
    }).map(u => u.id));
    lastResult = null; render(); return;
  }
  if(t.closest("[data-pickclear]")){ picked = new Set(); lastResult = null; render(); return; }
  if(t.closest("[data-applyrange]")){
    // A range is just a filter over the room list — the same set of rooms a
    // tick list would produce, typed faster.
    const from = document.getElementById("rgfrom").value.trim();
    const to = document.getElementById("rgto").value.trim();
    picked = new Set(units.filter(u => billableLeases(u.id).length
      && (!from || u.unit_number >= from) && (!to || u.unit_number <= to)).map(u => u.id));
    lastResult = null; render(); return;
  }
  if(t.closest("[data-togglemin]")){
    periodSettings[period] = !appliesMinimum(period);
    lastResult = null; render(); return;
  }
  if(t.closest("[data-toggleprorate]")){
    prorateOn = !prorateOn;
    if(!prorateOn) prorateDays = null;
    lastResult = null; render(); return;
  }
  if(t.closest("[data-generate]")){
    const made = [], skipped = [];
    picked.forEach(uid => {
      const unit = units.find(u => u.id === uid);
      const ls = billableLeases(uid);
      if(!ls.length){ skipped.push({unit:unit.unit_number, reason:"ไม่มีผู้เช่าเดือนนี้"}); return; }
      // One failing room must not stop the rest, and both leases in a handover
      // month are billed separately.
      ls.forEach(l => {
        if(billFor(l.id)){ skipped.push({unit:unit.unit_number, reason:"ออกบิลเดือนนี้ไปแล้ว"}); return; }
        const built = buildBill(l.id, period, {prorate:prorateOn, prorateDays});
        if(built.error){ skipped.push({unit:unit.unit_number, reason:built.error}); return; }
        made.push(saveBill(built));
      });
    });
    lastResult = { made: made.length, skipped, total: made.reduce((s,b)=>s+b.total,0) };
    picked = new Set(); render(); return;
  }
  const brow = t.closest("[data-bill]");
  if(brow){ go({name:"bill", id:parseInt(brow.dataset.bill,10)}); return; }
  if(t.closest("[data-backbills]")){ go({name:"bills"}); return; }
  if(t.closest("[data-printall]")){ go({name:"printall"}); return; }
  if(t.closest("[data-print]")){ window.print(); return; }
  if(t.closest("[data-keepbill]")){ go({name:"bills"}); return; }
  const rg = t.closest("[data-regen]");
  if(rg){
    // Delete then regenerate, in one action. The old figures are replaced, not
    // edited, because a bill stores what it charged rather than recomputing.
    const old = bills.find(x => x.id === parseInt(rg.dataset.regen,10));
    const built = buildBill(old.lease_id, old.period,
      {prorate: old.items[0].detail.includes("จาก"), prorateDays:null});
    if(built.error){ alert(built.error); return; }
    bills = bills.filter(x => x.id !== old.id);
    const fresh = saveBill(built);
    go({name:"bill", id:fresh.id}); return;
  }
  const db2 = t.closest("[data-delbill]");
  if(db2){ deleteBillModal(parseInt(db2.dataset.delbill,10)); return; }
  const cdb = t.closest("[data-confirmdelbill]");
  if(cdb){
    bills = bills.filter(x => x.id !== parseInt(cdb.dataset.confirmdelbill,10));
    closeModal(); go({name:"bills"}); return;
  }

  if(t.closest("[data-addfeetype]")){ feeTypeModal(null); return; }
  const eft = t.closest("[data-editfeetype]");
  if(eft){ feeTypeModal(parseInt(eft.dataset.editfeetype,10)); return; }
  const sft = t.closest("[data-savefeetype]");
  if(sft){ saveFeeType(sft.dataset.savefeetype ? parseInt(sft.dataset.savefeetype,10) : null); return; }
  const tgf = t.closest("[data-togglefee]");
  if(tgf){
    const f = feeTypes.find(x => x.id === parseInt(tgf.dataset.togglefee,10));
    f.is_active = f.is_active ? 0 : 1; render(); return;
  }
  const dft = t.closest("[data-delfeetype]");
  if(dft){ delFeeTypeModal(parseInt(dft.dataset.delfeetype,10)); return; }
  const cdft = t.closest("[data-confirmdelfeetype]");
  if(cdft){
    feeTypes = feeTypes.filter(f => f.id !== parseInt(cdft.dataset.confirmdelfeetype,10));
    closeModal(); render(); return;
  }
  if(t.closest("[data-backupnow]")){
    const now = new Date();
    const p2 = n => String(n).padStart(2,"0");
    const stamp = `${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
    backups.unshift({filename:`apartment-${stamp.replace(/[ :]/g,"-")}.db`, size_kb:96, created_at:stamp});
    if(backups.length > BACKUP_KEEP) backups.length = BACKUP_KEEP;
    render(); return;
  }

  const tf = t.closest("[data-tfilter]");
  if(tf){ tenantFilter = tf.dataset.tfilter; render(); return; }
  if(t.closest("[data-addtenant]")){ addTenantModal(); return; }
  if(t.closest("[data-savenewtenant]")){ saveNewTenant(); return; }
  if(t.closest("[data-backtenants]")){ go({name:"tenants"}); return; }
  const dt = t.closest("[data-deltenant]");
  if(dt){ deleteTenantModal(parseInt(dt.dataset.deltenant,10)); return; }
  const cdt = t.closest("[data-confirmdeltenant]");
  if(cdt){
    tenants = tenants.filter(x => x.id !== parseInt(cdt.dataset.confirmdeltenant,10));
    closeModal(); go({name:"tenants"}); return;
  }
  const gr = t.closest("[data-gotoroom]");
  if(gr){ go({name:"room", id:parseInt(gr.dataset.gotoroom,10)}); return; }
  const trow = t.closest("[data-tenant]");
  if(trow && !t.closest("button")){ go({name:"tenant", id:parseInt(trow.dataset.tenant,10)}); return; }

  const mf = t.closest("[data-mfilter]");
  if(mf){ meterFilter = mf.dataset.mfilter; render(); return; }
  if(t.closest("[data-togglevacant]")){ showVacant = !showVacant; render(); return; }
  const fr = t.closest("[data-fixroll]");
  if(fr){ applyRollover(parseInt(fr.dataset.fixroll,10), fr.dataset.kind); return; }
  const fn = t.closest("[data-fixnew]");
  if(fn){ applyNewMeter(parseInt(fn.dataset.fixnew,10), fn.dataset.kind); return; }
  const ep = t.closest("[data-editprev]");
  if(ep){ editPrevModal(parseInt(ep.dataset.editprev,10)); return; }
  const rp = t.closest("[data-restoreprev]");
  if(rp){
    const id = parseInt(rp.dataset.restoreprev,10);
    const p = previousReading(id, period);
    const row = readings.find(x=>x.unit_id===id && x.period===period);
    if(row) Object.assign(row, {water_prev:p.water, elec_prev:p.elec});
    closeModal(); render(); return;
  }
  const cr = t.closest("[data-clearroll]");
  if(cr){
    const row = readings.find(x=>x.unit_id===parseInt(cr.dataset.clearroll,10) && x.period===period);
    if(row) Object.assign(row, {water_rollover:0, elec_rollover:0});
    closeModal(); render(); return;
  }
  const sp = t.closest("[data-saveprev]");
  if(sp){ savePrev(parseInt(sp.dataset.saveprev,10)); return; }

  const chip = t.closest("[data-filter]");
  if(chip){ filter = chip.dataset.filter; render(); return; }

  if(t.closest("#pencil")){ editMode = !editMode; render(); return; }

  const add = t.closest("[data-addroom]");
  if(add){ addRoomModal(parseInt(add.dataset.addroom,10)); return; }

  if(t.closest("[data-addfloor]")){ addRoomModal(Math.max(0,...floors())+1); return; }

  const room = t.closest("[data-room]");
  if(room){ go({name:"room", id:parseInt(room.dataset.room,10)}); return; }

  if(t.closest("[data-back]")){ go({name:"board"}); return; }
  if(t.closest("[data-editroom]")){ editRoomModal(view.id); return; }
  if(t.closest("[data-delroom]")){ deleteRoomModal(view.id); return; }
  if(t.closest("[data-movein]")){ moveInModal(view.id); return; }
  const co = t.closest("[data-cancelout]");
  if(co){
    // Clearing end_date is a real action, not an omission. The API takes an
    // explicit null here; sending nothing would leave the old date in place.
    leases.find(x=>x.id===parseInt(co.dataset.cancelout,10)).end_date = null;
    render(); return;
  }
  if(t.closest("[data-outtoday]")){ document.getElementById("f_end").value = TODAY; return; }
  if(t.closest("[data-outmonthend]")){
    const d = new Date(TODAY);
    document.getElementById("f_end").value =
      new Date(d.getFullYear(), d.getMonth()+1, 1).toISOString().slice(0,10);
    return;
  }
  if(t.closest("[data-moveout]")){ moveOutModal(view.id); return; }
  if(t.closest("[data-editmeter]")){ meterModal(view.id); return; }

  const af = t.closest("[data-addfee]");
  if(af){ feeModal(parseInt(af.dataset.addfee,10), null); return; }
  const ef = t.closest("[data-editfee]");
  if(ef){ const f = leaseFees.find(x=>x.id===parseInt(ef.dataset.editfee,10));
    feeModal(f.lease_id, f.id); return; }
  const df = t.closest("[data-delfee]");
  if(df){ delFeeModal(parseInt(df.dataset.delfee,10)); return; }
  const cdf = t.closest("[data-confirmdelfee]");
  if(cdf){ leaseFees = leaseFees.filter(f=>f.id!==parseInt(cdf.dataset.confirmdelfee,10));
    closeModal(); render(); return; }

  const ac = t.closest("[data-addcharge]");
  if(ac){ chargeModal(parseInt(ac.dataset.addcharge,10)); return; }
  const dc = t.closest("[data-delcharge]");
  if(dc){ charges = charges.filter(c=>c.id!==parseInt(dc.dataset.delcharge,10)); render(); return; }

  const et = t.closest("[data-edittenant]");
  if(et){ editTenantModal(parseInt(et.dataset.edittenant,10)); return; }
  const el = t.closest("[data-editlease]");
  if(el){ editLeaseModal(parseInt(el.dataset.editlease,10)); return; }

  if(t.closest("[data-saveroom]")){ saveNewRoom(); return; }
  const se = t.closest("[data-saveedit]");
  if(se){ saveEditRoom(parseInt(se.dataset.saveedit,10)); return; }
  const mi = t.closest("[data-savemovein]");
  if(mi){ saveMoveIn(parseInt(mi.dataset.savemovein,10)); return; }
  const sf = t.closest("[data-savefee]");
  if(sf){ saveFee(parseInt(sf.dataset.savefee,10),
    sf.dataset.feeid ? parseInt(sf.dataset.feeid,10) : null); return; }
  if(t.closest("[data-savecharge]")){ saveCharge(); return; }
  const st = t.closest("[data-savetenant]");
  if(st){ saveTenant(parseInt(st.dataset.savetenant,10)); return; }
  const sl = t.closest("[data-savelease]");
  if(sl){ saveLease(parseInt(sl.dataset.savelease,10)); return; }
  const sm = t.closest("[data-savemeter]");
  if(sm){ saveMeter(parseInt(sm.dataset.savemeter,10)); return; }
  const mo = t.closest("[data-savemoveout]");
  if(mo){ saveMoveOut(parseInt(mo.dataset.savemoveout,10)); return; }
  const cd = t.closest("[data-confirmdel]");
  if(cd){
    units = units.filter(u=>u.id !== parseInt(cd.dataset.confirmdel,10));
    closeModal(); go({name:"board"}); return;
  }
});

// Enter walks down the column of inputs, which is how the numbers arrive off
// a clipboard: room by room, water then electricity.
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const cur = e.target;
  if(!cur.dataset || (!cur.dataset.w && !cur.dataset.e)) return;
  e.preventDefault();
  const all = [...document.querySelectorAll("[data-w],[data-e]")];
  const next = all[all.indexOf(cur) + 1];
  if(next){ next.focus(); next.select(); }
  else cur.blur();
});

document.addEventListener("input", e=>{
  const id = e.target.dataset.w || e.target.dataset.e;
  if(id){ commitMeter(parseInt(id,10)); return; }

  // Re-rendering the page would drop the caret, so the search box is put back
  // where it was afterwards.
  // Settings are typed into and the example recalculates as you go. Redrawing
  // the whole page on each keystroke would take the caret with it.
  // Updated in place so the caret stays put. An empty name is tolerated while
  // typing and only refused on save.
  const bmap = {bname:"building_name", baddr:"building_address", bphone:"building_phone",
                bkname:"bank_name", bkno:"bank_account_number", bkacc:"bank_account_name",
                bnote:"bill_note"};
  if(bmap[e.target.id]){
    settings[bmap[e.target.id]] = e.target.value;
    document.getElementById("brandname").textContent = settings.building_name.trim() || "—";
    const set = (k, txt) => {
      const el = document.querySelector(`[data-prev="${k}"]`);
      if(el) el.textContent = txt;
    };
    set("name", settings.building_name.trim() || "—");
    set("addr", settings.building_address.trim() || "—");
    set("phone", "โทร " + (settings.building_phone.trim() || "—"));

    // Only the parts that were filled in appear, so a blank field prints as
    // nothing rather than as a dash on a real invoice.
    const bank = [settings.bank_name.trim(), settings.bank_account_number.trim()]
      .filter(Boolean).join("  ");
    const acc = settings.bank_account_name.trim();
    set("bank", [bank, acc ? `ชื่อบัญชี ${acc}` : ""].filter(Boolean).join(" · ") || "—");
    set("note", settings.bill_note.trim() || "—");
    return;
  }
  if(e.target.id === "pdays"){
    const v = parseInt(e.target.value,10);
    prorateDays = isNaN(v) ? null : v;
    return;
  }
  const setKey = e.target.dataset.set;
  if(setKey){
    const v = parseFloat(e.target.value);
    if(!isNaN(v) && v >= 0){
      settings[setKey] = v;
      if(setKey.endsWith("_meter_digits")){
        const kind = setKey.replace("_meter_digits","");
        const cap = document.querySelector(`[data-cap="${kind}"]`);
        if(cap) cap.textContent = Math.pow(10, v).toLocaleString();
      }
      ["water","electricity"].forEach(k => {
        const out = document.querySelector(`[data-egout="${k}"]`);
        if(out) out.textContent = baht(utilityCharge(k, exampleUnits[k]));
      });
    }
    return;
  }
  const egKind = e.target.dataset.eg;
  if(egKind){
    const v = parseFloat(e.target.value);
    exampleUnits[egKind] = isNaN(v) ? 0 : v;
    const out = document.querySelector(`[data-egout="${egKind}"]`);
    if(out) out.textContent = baht(utilityCharge(egKind, exampleUnits[egKind]));
    return;
  }

  if(e.target.id === "tsearch"){
    tenantSearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const box = document.getElementById("tsearch");
    if(box){ box.focus(); box.setSelectionRange(pos, pos); }
  }
});

document.addEventListener("change", e=>{
  if(e.target.id === "fe_type"){
    const opt = e.target.selectedOptions[0];
    const amt = document.getElementById("fe_amt");
    if(opt && amt) amt.value = opt.dataset.amt;
  }
  if(e.target.id === "f_tenant"){
    const w = document.getElementById("newNameWrap");
    const info = document.getElementById("tenantInfo");
    const v = e.target.value;
    if(w) w.style.display = v === "new" ? "block" : "none";
    if(info){
      if(v && v !== "new"){
        const t = tenants.find(x=>x.id===parseInt(v,10));
        const missing = [];
        if(!t.phone) missing.push("เบอร์โทร");
        if(!t.address) missing.push("ที่อยู่");
        info.innerHTML = `<div class="warn">
          <b>${t.full_name}</b><br>
          โทร ${t.phone || "—"}<br>ที่อยู่ ${t.address || "—"}
          ${missing.length ? `<br><span style="color:var(--vacant)">
            ยังไม่มี ${missing.join(" และ ")} ซึ่งต้องขึ้นบนใบแจ้งหนี้
            — แก้ได้ที่หน้าผู้เช่า</span>` : ``}
        </div>`;
      } else info.innerHTML = "";
    }
  }
});

// Two bills already issued, so the list and the staleness check have something
// to show without generating first.
[1, 5].forEach(lid => {
  const built = buildBill(lid, period);
  if(!built.error) saveBill(built);
});

render();
</script>
</body>
</html>
